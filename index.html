<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rajasthan Desert AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    .ar-instructions {
      position: fixed;
      top: 15px;
      left: 0;
      width: 100%;
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 16px;
      z-index: 10;
      text-shadow: 1px 1px 4px #000;
      pointer-events: none;
    }
  </style>

  <script>
    // Make the camel slowly walk from left to right.
    AFRAME.registerComponent("slow-walk", {
      schema: {
        distance: { type: "number", default: 0.35 },
        speed: { type: "number", default: 0.0003 }
      },

      init: function () {
        this.startX = this.el.object3D.position.x;
        this.startTime = null;
      },

      tick: function (time) {
        if (this.startTime === null) this.startTime = time;

        const elapsed = time - this.startTime;
        const distance = this.data.distance;
        const speed = this.data.speed;

        // Gentle side-to-side walking movement.
        this.el.object3D.position.x =
          this.startX + Math.sin(elapsed * speed) * distance;
      }
    });
  </script>
</head>

<body>
  <div class="ar-instructions">
    Scan your Rajasthan desert picture
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <!-- We create the cactus and camel using 3D shapes. -->
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- This content appears when your target image is detected. -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- CACTUS BODY -->
      <a-entity position="-0.35 -0.05 0">

        <!-- Main cactus stem -->
        <a-cylinder
          position="0 0.18 0"
          radius="0.055"
          height="0.42"
          color="#477447"
          material="roughness: 0.9">
        </a-cylinder>

        <!-- Left cactus arm -->
        <a-cylinder
          position="-0.09 0.16 0"

        <a-cylinder

        </a-cylinder>

        <a-cylinder

        <a-sphere

        <a-sphere

      </a-entity>

      <!-- CAMEL: simple 3D model made from shapes -->
      <a-entity
        id="camel"

        <!-- Body -->

        </a-sphere>

        <!-- Hump -->
        <a-sphere
          position="-0.03 0.31 0"
          scale="0.09 0.10 0.08"
          color="#A96532">
        </a-sphere>

        <!-- Neck -->
        <a-cylinder
          position="0.16 0.32 0"
          rotation="0 0 -25"
          radius="0.045"
          height="0.25"
          color="#B8793E">
        </a-cylinder>

        <!-- Head -->
        <a-sphere
          position="0.23 0.44 0"

        </a-sphere>

        <!-- Muzzle -->
        <a-sphere

        </a-sphere>

      </a-entity>

    </a-entity>
  </a-scene>
</body>
