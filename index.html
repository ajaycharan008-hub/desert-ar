<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8b492d">
  <title>Jharokha — Living Rajasthan</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="./ar-scenes/desert-scene.js"></script>
  <script src="./ar-scenes/art-models.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Georgia, 'Times New Roman', serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    html { background: #171b1b; }
    body { background: transparent; }
    a-scene { position: fixed; inset: 0; background: transparent !important; }
    .a-canvas { background: transparent !important; }
    .hud { position: fixed; z-index: 5; inset: env(safe-area-inset-top, 0) 0 auto; display: grid; justify-items: center; gap: .45rem; padding: 1rem 1.1rem; pointer-events: none; text-align: center; }
    .brand { padding: .42rem .8rem; border: 1px solid #f3d7a288; border-radius: 999px; background: #251d19cc; color: #f6e7c9; font: 600 .72rem/1.1 system-ui, sans-serif; letter-spacing: .17em; text-transform: uppercase; }
    .hint { max-width: 30rem; padding: .5rem .8rem; border-radius: 1rem; background: #1c211edb; color: #fff6e6; font: .9rem/1.35 system-ui, sans-serif; text-shadow: 0 1px 3px #000; }
    .hint[data-state="found"] { color: #f5dca6; }
    #start-camera { display: none; margin-top: .3rem; padding: .7rem 1.15rem; border: 1px solid #f0d59b; border-radius: 999px; background: #7d482d; color: #fff7e6; font: 700 .9rem system-ui, sans-serif; pointer-events: auto; }
    #start-camera:disabled { opacity: .65; }
    .credit { position: fixed; z-index: 5; inset: auto 0 env(safe-area-inset-bottom, 0); padding: .75rem; color: #fff4dfb3; text-align: center; font: .68rem system-ui, sans-serif; pointer-events: none; }
    .a-enter-vr { display: none !important; }
  </style>
</head>
<body>
  <header class="hud" aria-live="polite">
    <div class="brand">Jharokha · Rajasthan pop-up book</div>
    <div class="hint" id="status">Preparing the book’s image library…</div>
    <button id="start-camera" type="button">Start camera</button>
  </header>
  <div class="credit">Point at any prepared book illustration to reveal its 3D miniature</div>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1; uiLoading: no; uiScanning: no; uiError: no"
    renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true; antialias: true"
    color-space="sRGB"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">
    <a-entity light="type: ambient; color: #fff0d8; intensity: 1.1"></a-entity>
    <a-entity light="type: directional; color: #ffe0a6; intensity: 1.45" position="-1 2 1"></a-entity>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target-pages"></a-entity>
  </a-scene>
  <script>
    const sceneEl = document.querySelector('a-scene');
    const pagesRoot = document.getElementById('target-pages');
    const statusEl = document.getElementById('status');
    const startButton = document.getElementById('start-camera');

    async function preparePages() {
      const response = await fetch('./Images/targets/target-manifest.json');
      if (!response.ok) throw new Error('The prepared image list is missing.');
      const manifest = await response.json();
      for (const page of manifest.targets) {
        const anchor = document.createElement('a-entity');
        anchor.setAttribute('mindar-image-target', `targetIndex: ${page.targetIndex}`);
        anchor.addEventListener('targetFound', () => {
          statusEl.dataset.state = 'found';
          statusEl.textContent = `${page.label} · 3D scene found`;
        });
        anchor.addEventListener('targetLost', () => {
          statusEl.dataset.state = '';
          statusEl.textContent = 'Point at any prepared book illustration.';
        });

        const model = document.createElement('a-entity');
        if (page.targetIndex === 0) model.setAttribute('desert-miniature', '');
        else model.setAttribute('jharokha-art-model', `kind: ${page.scene}`);
        anchor.appendChild(model);
        pagesRoot.appendChild(anchor);
      }
      statusEl.textContent = `${manifest.count} illustrations ready. Start the camera and scan one.`;
      startButton.style.display = 'block';
    }

    sceneEl.addEventListener('arReady', () => { statusEl.textContent = 'Camera ready — point at an illustration.'; });
    sceneEl.addEventListener('arError', () => { statusEl.textContent = 'Camera could not start. Open this page over HTTPS and allow camera access.'; });
    startButton.addEventListener('click', async () => {
      startButton.disabled = true;
      statusEl.textContent = 'Starting camera…';
      try { await sceneEl.systems['mindar-image-system'].start(); }
      catch (error) {
        console.error('MindAR camera start failed:', error);
        statusEl.textContent = `Could not start the camera. ${error?.message || 'Check browser permissions and HTTPS.'}`;
        startButton.disabled = false;
      }
    });

    preparePages().catch(error => { statusEl.textContent = `Could not prepare the image library: ${error.message}`; });
  </script>
</body>
</html>
